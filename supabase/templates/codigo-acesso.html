<!-- Código de acesso (login sem senha). Usado no primeiro acesso e no dia a dia. -->
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 18px; color: #111111; max-width: 480px;">
  <h2 style="font-size: 24px;">Seu código de acesso ao Meu Dízimo</h2>
  <p>Digite este código no aplicativo para entrar:</p>
  <p style="font-size: 36px; font-weight: bold; letter-spacing: 8px;">{{ .Token }}</p>
  <p>O código vale por 1 hora e só pode ser usado uma vez.</p>
  <p style="font-size: 14px; color: #555555;">Se você não pediu este código, ignore este e-mail.</p>
</div>
